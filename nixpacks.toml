[phases.setup]
nixPkgs = ["nodejs_20", "python312"]

[phases.install]
cmds = [
  "python3 -m venv /opt/venv",
  "/opt/venv/bin/pip install --upgrade pip",
  "/opt/venv/bin/pip install -r requirements.txt",
  "cd frontend/AK_chemetics_Company_rag && npm install"
]

[start]
cmd = "cd frontend/AK_chemetics_Company_rag && npm run build && PYTHON_PATH=/opt/venv/bin/python3 node server.js"
