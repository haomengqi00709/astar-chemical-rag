[phases.setup]
nixPkgs = ["nodejs_20", "python312", "libreoffice"]
aptPkgs = ["libreoffice-writer"]

[phases.install]
cmds = [
  "python3 -m venv /opt/venv",
  "/opt/venv/bin/pip install --upgrade pip",
  "/opt/venv/bin/pip install -r requirements.txt",
  "cd frontend/AK_chemetics_Company_rag && npm install"
]

[phases.build]
cmds = [
  "cd frontend/AK_chemetics_Company_rag && npm run build",
  "/opt/venv/bin/python3 load_vectorstore.py"
]

[start]
cmd = "PYTHON_PATH=/opt/venv/bin/python3 node frontend/AK_chemetics_Company_rag/server.js"
